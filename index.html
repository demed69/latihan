<!DOCTYPE html>
<html>
<head>
  <title>My CV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Your Name</h1>
    <p>your.email@example.com | (123) 456-7890</p>
  </header>

  <section id="experience">
    <h2>Experience</h2>
    <article>
      <h3>Job Title</h3>
      <p>Company Name | Date Range</p>
    </article>
  </section>

  <section id="education">
    <h2>Education</h2>
    <article>
      <h3>Degree Name</h3>
      <p>University Name | Date Range</p>
    </article>
  </section>

  <section id="skills">
    <h2>Skills</h2>
    <ul>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
    </ul>
  </section>

  <section id="portfolio">
    <h2>Portfolio</h2>
    <article>
      <h3>Project Name</h3>
      <p>A short description of the project and technologies used.</p>
    </article>
  </section>
</body>
</html>
